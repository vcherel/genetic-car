[project]
name = "genetic-car"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "matplotlib>=3.8.0",
]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
